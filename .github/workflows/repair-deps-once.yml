name: One-off Soriko dependency repair
on:
  push:
    paths:
      - '.github/workflows/repair-deps-once.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Upgrade Next and lock patched transitive versions
        run: |
          npm install --save-exact next@16.4.0
          npm pkg set overrides.sharp=0.35.5 overrides.source-map-js=1.2.2
          npm install --package-lock-only
          npm ci
      - name: Security audit
        run: npm audit --audit-level=moderate
      - name: Tests and production build
        run: |
          node --experimental-strip-types --test tests/engine.test.mjs
          npx tsc --project tsconfig.edge.json
          npm run build
          npx wrangler deploy --dry-run
      - name: Commit resolved manifest and lockfile
        run: |
          git config user.name "Soriko dependency maintenance"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Security: pin Next 16.4.0 and patched transitive packages"
            git push origin HEAD:main
          fi
