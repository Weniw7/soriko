name: Deploy Soriko to Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: soriko-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: node --experimental-strip-types --test tests/engine.test.mjs
      - run: npx tsc --project tsconfig.edge.json
      - run: npm run build
      - name: Stamp the exact published commit
        run: node scripts/build-marker.mjs
      - name: Deploy tested static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing Cloudflare token" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing Cloudflare account" && exit 1)
          npx wrangler deploy
      - name: Verify published commit and routes
        run: node scripts/verify-deployment.mjs
