name: One-off Soriko Shop Browser QA
on:
  push:
    paths:
      - '.github/workflows/shop-browser-qa-once.yml'
permissions:
  contents: read
jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Verify live cards, stock and actual browser API loading
        run: |
          node --input-type=module <<'EOF'
          import {chromium} from 'playwright';
          import assert from 'node:assert/strict';
          import sharp from 'sharp';
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          for(const [name,viewport] of [
            ['desktop',{width:1440,height:900}],
            ['mobile',{width:390,height:844}]
          ]){
            const page=await browser.newPage({viewport});
            const runtimeErrors=[];
            const api=[];
            page.on('pageerror',error=>runtimeErrors.push(error.message));
            page.on('response',r=>{if(r.url().includes('/functions/v1/soriko-commerce'))
              api.push({code:r.status(),path:r.url().split('?')[1]||''});});
            const nav=await page.goto('https://soriko.alfonso-millan.workers.dev/shop/',{
              waitUntil:'domcontentloaded',timeout:45000
            });
            assert.equal(nav.status(),200);
            const card=page.locator('.pokemonProductCard').filter({
              has:page.getByRole('heading',{name:'30th CELEBRATION [M6a]'})
            });
            await card.waitFor({state:'visible',timeout:30000});
            assert.match(await card.innerText(),/177,18/);
            assert.match(await card.innerText(),/Agotado/);
            assert.equal(await card.getByRole('button',{name:'Añadir +'}).isDisabled(),true);
            assert.ok(api.some(x=>x.code===200),JSON.stringify(api));
            assert.deepEqual(runtimeErrors,[]);
            await card.scrollIntoViewIfNeeded();
            await page.waitForTimeout(2400);
            const image=card.locator('img');
            const imageOk=await image.count()?
              await image.first().evaluate(e=>e.complete && e.naturalWidth>0):false;
            const placeholder=await card.locator('.packShape').isVisible();
            assert.ok(imageOk||placeholder,'Product photo or fallback must be visible');
            const out='/tmp/soriko-shop-'+name+'.png';
            await card.screenshot({path:out});
            const preview=await sharp(out).resize({width:800,withoutEnlargement:true})
              .jpeg({quality:40}).toBuffer();
            console.log('BROWSER_PASS '+name+' product=TK-0164 status=200 stock=0 add_disabled=true image_loaded='+imageOk+' branded_fallback='+placeholder);
            const b64=preview.toString('base64');
            console.log('SHOT_BEGIN '+name+' '+preview.length);
            for(let i=0;i<b64.length;i+=4000)console.log('SHOT_CHUNK '+b64.slice(i,i+4000));
            console.log('SHOT_END '+name);
            await page.close();
          }
          const admin=await browser.newPage();
          const resp=await admin.goto('https://soriko.alfonso-millan.workers.dev/admin/products/',{
            waitUntil:'domcontentloaded',timeout:45000
          });
          assert.equal(resp.status(),200);
          await admin.getByRole('heading',{name:'Acceso al panel'}).waitFor({timeout:20000});
          console.log('ADMIN_LOGIN_PASS');
          await browser.close();
          EOF
