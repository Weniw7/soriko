name: Soriko CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: soriko-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=moderate
      - name: Deterministic engine tests
        run: node --experimental-strip-types --test tests/engine.test.mjs
      - name: Check Edge Function types
        run: npx tsc --project tsconfig.edge.json
      - run: npm run build
      - run: npx wrangler deploy --dry-run
