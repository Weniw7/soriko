name: Soriko CI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate dependency lock
        run: npm install --package-lock-only

      - name: Install exact dependencies
        run: npm ci

      - name: Build static Soriko site
        run: npm run build

      - name: Validate Cloudflare bundle
        run: npx wrangler deploy --dry-run

      - name: Commit lockfile
        run: |
          if ! git diff --quiet -- package-lock.json || [ -n "$(git ls-files --others --exclude-standard package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: lock Soriko dependencies [skip ci]"
            git push
          fi
